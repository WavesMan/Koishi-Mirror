version: '3.8'

services:
  npm-mirror:
    build: .
    image: waveyo/npm-mirror:latest
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - DB_DSN=${DB_DSN:-postgres://npm_mirror:password@postgres:5432/npm_mirror?sslmode=disable}
      # S3 配置 - 请修改为实际值
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_PREFIX=${S3_PREFIX:-packages}
      # 同步配置
      - DATA_SOURCE_URL=${DATA_SOURCE_URL:-https://ks-store.waveyo.cn/index.json}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-1h}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=npm_mirror
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=npm_mirror
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npm_mirror -d npm_mirror"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
